<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Painel Antifraude</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>Painel Antifraude</h1>
      <div class="subtitle">Acesso restrito a analistas e à equipe técnica.</div>

      {% if erro %}
        <div class="flash erro">{{ erro }}</div>
      {% endif %}

      <form method="POST">
        <label for="chave">Chave de acesso</label>
        <input type="password" id="chave" name="chave" autofocus required>
        <button type="submit" class="btn primary">Entrar</button>
      </form>

      <div class="disclaimer">
        As classificações exibidas são estimativas geradas por modelo de
        Machine Learning e não substituem a análise humana final.
      </div>
    </div>
  </div>
</body>
</html>
